name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.13'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra auth --extra portal
      - run: uv run --frozen --extra auth --extra portal ruff check src scripts tests budget/functions
      - run: uv run --frozen --extra auth --extra portal ruff format --check src scripts tests budget/functions
      - run: uv run --frozen --extra auth --extra portal pytest -q
      - run: bash -n scripts/macos/install.sh Install.command
      - run: uv build
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: az bicep build --file infra/main.bicep --outfile /tmp/claude-foundry.arm.json
      - run: az bicep build --file infra/portal.bicep --outfile /tmp/claude-foundry-portal.arm.json
      - run: az bicep build --file infra/content-logs.bicep --outfile /tmp/ccf-content-logs.arm.json
      - run: az bicep build --file infra/budget.bicep --outfile /tmp/ccf-budget.arm.json
      - run: az bicep build --file infra/budget-portal.bicep --outfile /tmp/ccf-budget-portal.arm.json
      - run: az bicep build --file infra/budget-recovery.bicep --outfile /tmp/ccf-budget-recovery.arm.json
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
