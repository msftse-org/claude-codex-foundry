[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "claude-foundry"
version = "0.1.0"
description = "Deploy and onboard Claude Desktop and Code through standard Azure API Management and Foundry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
auth = ["msal>=1.33,<2", "msal-extensions>=1.3,<2"]

[project.scripts]
claude-foundry = "claude_foundry.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
