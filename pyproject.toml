[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "claude-foundry"
version = "0.1.0"
description = "Deploy and onboard Claude and Codex through standard Azure API Management and Foundry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
auth = ["msal>=1.33,<2", "msal-extensions>=1.3,<2"]
portal = [
    "azure-data-tables>=12.7,<13",
    "azure-functions>=1.23,<2",
    "azure-identity>=1.21,<2",
    "azure-storage-blob>=12.25,<13",
    "azurefunctions-extensions-http-fastapi>=1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
claude-foundry = "claude_foundry.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
